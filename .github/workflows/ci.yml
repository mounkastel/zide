# CI: lint, full test matrix, Bash 5.0 compat, and pty-driven wizard tests.
name: ci
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck cmake ninja-build gcc g++ git jq make cargo rustc
          curl -sSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          chmod +x /tmp/shfmt && sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - run: make lint
      - run: make test
        env:
          ZIDE_REQUIRE_PTY: "1"
  compat:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc g++ git jq make curl ca-certificates cargo rustc python3-pip
          pip3 install -q "cmake==3.28.*" ninja
      - name: Verify CMake floor (>= 3.21)
        run: |
          cmake --version
          ver=$(cmake --version | head -n1 | grep -Eo '[0-9]+\.[0-9]+' | head -n1)
          major=${ver%%.*}
          minor=${ver#*.}
          if [ "$major" -gt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -ge 21 ]; }; then
            echo "cmake $ver >= 3.21 floor OK"
          else
            echo "cmake $ver is below the 3.21 floor — failing the job"
            exit 1
          fi
      - run: make test-compat
        env:
          ZIDE_REQUIRE_PTY: "1"
  wizard-pty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc git
      - run: bash tests/t-adopt-safe.sh
        env:
          ZIDE_REQUIRE_PTY: "1"
